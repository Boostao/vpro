name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs-src/**'
      - 'scripts/**'
      - 'r/**'
      - 'app/resources/standards-2026-provenance.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R package and pkgdown dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: bcgov/climr, local::.

      - name: Hydrate release-manifest.json from published GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release.py sync-release-manifest --base-manifest site/release-manifest.json --output site/release-manifest.json

      - name: Build single-source docs and BC Gov release portal
        run: node scripts/build-docs-src.mjs && node site/build.mjs

      - name: Build pkgdown R Companion SDK documentation into site/dist/r
        working-directory: r
        run: Rscript -e "pkgdown::build_site()"

      - name: Verify unified portal and pkgdown outputs
        run: |
          set -euo pipefail
          test -s site/dist/index.html
          test -s site/dist/r-logo.svg
          test -s site/dist/r/index.html
          test -s site/dist/r/logo.svg
          test -s site/dist/r/favicon.ico
          grep -q 'href="./r/"' site/dist/index.html
          grep -q 'VPro Desktop &amp; Downloads' site/dist/r/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
