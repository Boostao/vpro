# VPro Application Configuration
# Environment-specific settings for local development, testing, and production

default:
  # Logging
  log_level: INFO
  
  # Local DuckDB settings
  duckdb:
    main_db: "data/vpro.duckdb"
    lists_db: "data/vpro_lists.duckdb"
    metadata_db: "data/vpro_metadata.duckdb"
    user_db: "data/vpro_user.duckdb"
    messages_db: "data/vpro_messages.duckdb"

  postgres:
    host: localhost
    port: 5433
    database: becmaster
    user: testuser
    password: testpass
    use_env_vars: false
    
  # Session defaults
  session:
    timeout_minutes: 480
    auto_sync: true

test:
  # Test environment - ephemeral Postgres from docker-compose or testcontainers
  postgres:
    host: localhost
    port: 5433
    database: becmaster
    user: testuser
    password: testpass
    use_env_vars: false
    
  cloud:
    enabled: true
    attach_on_startup: true  # Auto-attach for tests
    read_only: false
    attach_timeout_seconds: 30
    
  log_level: DEBUG
  
  # Test data settings
  test_data:
    seed_minimal: true
    cleanup_after_test: true

