url: https://boostao.github.io/vpro/r
destination: ../site/dist/r

repo:
  url:
    home: https://github.com/Boostao/vpro/
    source: https://github.com/Boostao/vpro/blob/main/r/
    issue: https://github.com/Boostao/vpro/issues/
    user: https://github.com/

template:
  bootstrap: 5
  bslib:
    primary: "#003366"
    secondary: "#38598A"
    warning: "#FCBA19"
    bg: "#FFFFFF"
    fg: "#313132"
    base_font: "BC Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
    heading_font: "BC Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"

navbar:
  bg: primary
  type: dark
  structure:
    left:  [desktop, intro, reference, articles, news]
    right: [search, github]
  components:
    desktop:
      text: VPro Desktop & Downloads
      href: https://boostao.github.io/vpro/
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/Boostao/vpro
      aria-label: GitHub repository
    articles:
      text: Workflows
      menu:
      - text: VPro Rosetta Stone (Access <-> Go <-> R 2.0)
        href: articles/vpro-rosetta-stone.html
      - text: Live Workspace and Tidy Extraction
        href: articles/getting-started-with-vpro.html
      - text: Community Ecology and Clustering Round-Trip
        href: articles/community-ecology-and-clustering.html
      - text: BEC Diagnostics, Pairwise Similarity, and Synthesis
        href: articles/bec-diagnostics-and-synthesis.html
      - text: Climate Normals, aSMR, and Edatopic Grids
        href: articles/climate-asmr-and-edatopic-grids.html
      - text: Cloud BECMaster Governance, Merge, and Snapshots
        href: articles/cloud-becmaster-governance-and-sync.html

