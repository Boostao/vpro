version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vpro-postgres-test
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: becmaster
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/00_schema_becmaster_test.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d becmaster"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vpro-network

volumes:
  postgres_data:
    driver: local

networks:
  vpro-network:
    driver: bridge
